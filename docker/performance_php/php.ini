[PHP]
date.timezone = UTC
zend.assertions = 1
upload_max_filesize = 32M
post_max_size = 32M
file_uploads = On
; Defence in depth against PHP2Shell (CVE-2026-109618/109619), which abused
; upload progress tracking. The app never uses it.
session.upload_progress.enabled = 0
memory_limit = 1024M
; Errors go to the container log, never into the JSON responses.
display_errors = Off
log_errors = On
extension=mongodb.so
max_execution_time = 3000
max_input_time = 300